[workspace]
members = [
    "crates/cadx-config",
    "crates/cadx-core",
    "crates/cadx-io",
    "crates/cadx-render",
    "crates/cadx-agent",
    "crates/cadx-app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
crc32fast = "1.5"
url = "2.5"
genai = "=0.7.0-beta.14"
tokio = { version = "1", features = ["rt-multi-thread"] }
dxf = "=0.6.1"
pdf-writer = "=0.15.0"
lopdf = "=0.44.0"
earcutr = "=0.5.0"
bytemuck = { version = "1.23", features = ["derive"] }
sha2 = "0.10"
sys-locale = "0.3"
tempfile = "3.27"
uuid = { version = "1.24", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
