[workspace]
members = [
    "crates/cadx-core",
    "crates/cadx-agent",
    "crates/cadx-app",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://example.invalid/cadx"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
